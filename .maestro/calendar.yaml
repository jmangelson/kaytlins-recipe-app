# Put a plan on the calendar (twice), edit one date without changing the plan,
# reapply keeping days that already have meals, and move between weeks.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - calendar
  - quick
---
- evalScript: ${output.email = 'calendar' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: plan
- tapOn: 'Calendar'
- assertVisible: 'Nothing planned'
- assertNotVisible: 'Dinner: .*'

# Week A (2 days) every week for 2 weeks from the start of this week
- tapOn: 'Apply a plan'
- tapOn: 'Use Week A'
- assertVisible: 'Week A → .*\(2 days\)'
- tapOn: 'Every week'
- assertVisible: 'For 4 weeks'
- tapOn: 'Fewer weeks'
- tapOn: 'Fewer weeks'
- assertVisible: 'Week A, every week for 2 weeks: 2 times \(4 days\)'
- scrollUntilVisible:
    element: 'Apply to calendar'
- tapOn: 'Apply to calendar'
- extendedWaitUntil:
    visible: 'Dinner: Chicken Enchiladas, Pico'
    timeout: 15000
- assertVisible: 'From Week A · Day 1'
- assertVisible: 'Dinner: Veggie Pasta'

# Edit one date: only that date changes
- tapOn:
    text: 'Dinner: Chicken Enchiladas, Pico'
    index: 0
- extendedWaitUntil:
    visible: 'Remove Pico from .*'
    timeout: 15000
- tapOn:
    text: 'Remove Pico from .*'
- assertVisible: 'Apply a plan from this day'
- tapOn: 'Save day'
- extendedWaitUntil:
    visible: 'Dinner: Chicken Enchiladas'
    timeout: 15000
# Only that date changed (next week's copy still has Pico; checked below)
- assertNotVisible: 'Dinner: Chicken Enchiladas, Pico'

# Reapply: days with meals are kept by default
- tapOn: 'Apply a plan'
- tapOn: 'Use Week A'
- extendedWaitUntil:
    visible: '.* already ha.* meals.*'
    timeout: 15000
- scrollUntilVisible:
    element: 'Apply to calendar'
- tapOn: 'Apply to calendar'
- extendedWaitUntil:
    visible: 'Dinner: Chicken Enchiladas'
    timeout: 15000

# The plan itself is unchanged
- tapOn: 'Plans'
- tapOn: 'Week A.*'
- scrollUntilVisible:
    element: 'Pico'
- back
- tapOn: 'Calendar'

# Week navigation: the repeat put Week A on next week too
- tapOn: 'Next week'
- assertVisible: 'Back to this week'
- assertVisible: 'Dinner: Chicken Enchiladas, Pico'
- tapOn: 'Back to this week'
- assertVisible: 'Dinner: Chicken Enchiladas'
