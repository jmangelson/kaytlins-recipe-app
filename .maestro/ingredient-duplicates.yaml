# Find duplicate ingredients (tests use a stand-in for Claude that pairs
# near-identical spellings), review the suggestion, and merge it.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - ingredients
---
- evalScript: ${output.email = 'dupes' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: recipes
# A recipe whose ingredient name carries a note ("minced garlic")
- runFlow:
    file: subflows/add-recipe.yaml
    env:
      NAME: 'Garlic bread'
      TAG: 'Vegetarian'
      LINE1: '2 cloves minced garlic'
      LINE2: '1 loaf French bread'
- back

# Two ingredients that are one thing: zucchini, and a typo of it
- tapOn: 'Shopping'
- runFlow:
    file: subflows/add-item.yaml
    env:
      TEXT: 'zucchini'
- scrollUntilVisible:
    element: 'Add zucchini'
    centerElement: true
- tapOn: 'Add zucchini'
- runFlow:
    file: subflows/add-item.yaml
    env:
      TEXT: 'zucchinni'
- runFlow:
    when:
      visible: 'Which .* do you mean.*'
    commands:
      - tapOn: 'zucchinni is a new item'
- scrollUntilVisible:
    element: 'Add zucchinni'
    centerElement: true
- tapOn: 'Add zucchinni'
# Plain garlic already exists, so tidying "minced garlic" merges into it
- runFlow:
    file: subflows/add-item.yaml
    env:
      TEXT: 'garlic'
- tapOn: 'New: garlic'
# (a known name adds right away; a new one asks first)
- runFlow:
    when:
      visible: 'Add garlic'
    commands:
      - scrollUntilVisible:
          element: 'Add garlic'
          centerElement: true
      - tapOn: 'Add garlic'

- tapOn: 'Settings'
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM: 'Ingredients'
- tapOn: 'AI-Assisted Cleanup'
- extendedWaitUntil:
    visible: '.*looks over your .* ingredients.*'
    timeout: 15000
# Nothing goes to Claude until she runs the audit
- assertVisible: 'Uses Claude.*Nothing is sent until you tap it.'
- tapOn: 'Run Automatic Ingredient Audit'
- extendedWaitUntil:
    visible: 'Run the audit again'
    timeout: 15000
- scrollUntilVisible:
    element: 'Spelled almost the same'
    centerElement: true
- takeScreenshot: build/screenshots/100-duplicates
- scrollUntilVisible:
    element:
      id: 'duplicate-final-name'
    centerElement: true
# She sets the final name (the category stays as suggested)
- tapOn:
    id: 'duplicate-final-name'
- eraseText: 20
- inputText: 'zucchini squash'
- hideKeyboard
- scrollUntilVisible:
    element: 'Merge zucchinni into zucchini'
    centerElement: true
- takeScreenshot: build/screenshots/101-duplicates-final-name
- tapOn: 'Merge zucchinni into zucchini'
- extendedWaitUntil:
    visible: 'Merged.'
    timeout: 15000
# Running it again uses the ingredients as they are now: no repeat
- scrollUntilVisible:
    element: 'Run the audit again'
    direction: UP
- tapOn: 'Run the audit again'
- extendedWaitUntil:
    visible: 'Run the audit again'
    timeout: 15000
- assertNotVisible: 'Merge zucchinni into.*'
- assertNotVisible: 'Spelled almost the same'
- back
- scrollUntilVisible:
    element: 'zucchini squash, Greens & vegetables.*'
    centerElement: true
- assertNotVisible: 'zucchinni.*'
- assertNotVisible: 'zucchini, .*'

# Tidy "minced garlic": "minced" moves into the recipe's note (still on
# the Ingredients screen)
- scrollUntilVisible:
    element: 'AI-Assisted Cleanup'
    direction: UP
- tapOn: 'AI-Assisted Cleanup'
- extendedWaitUntil:
    visible: '.*looks over your .* ingredients.*'
    timeout: 15000
- tapOn: 'Run Automatic Ingredient Audit'
- extendedWaitUntil:
    visible: 'Run the audit again'
    timeout: 15000
- scrollUntilVisible:
    element: '“minced” is how to prepare it'
    centerElement: true
- scrollUntilVisible:
    element: '“minced” moves to the notes in minced garlic’s recipes.'
    centerElement: true
- scrollUntilVisible:
    element: 'You already have “garlic”. minced garlic will merge into it.'
    centerElement: true
- takeScreenshot: build/screenshots/102-tidy-name
- scrollUntilVisible:
    element: 'Merge minced garlic into garlic'
    centerElement: true
- tapOn: 'Merge minced garlic into garlic'
- extendedWaitUntil:
    visible: 'Merged.'
    timeout: 15000
- back
- back
- tapOn: 'Recipes'
- tapOn: 'Garlic bread.*'
- extendedWaitUntil:
    visible: 'garlic, minced'
    timeout: 15000
