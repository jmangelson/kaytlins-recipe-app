# Ingredients saved from a recipe start without a store; assign one a store
# and area and see it reflected in the list and the "No store yet" filter.
appId: com.jmangelson.kaytlinsrecipes
---
- launchApp:
    clearState: true
- evalScript: ${output.email = 'ingredients' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/sign-in-test-user.yaml
    env:
      EMAIL: ${output.email}
- runFlow: subflows/create-household.yaml
- runFlow:
    file: subflows/add-recipe.yaml
    env:
      NAME: 'Salsa'
      TAG: 'Vegetarian'
      LINE1: '4 roma tomatoes'
      LINE2: '1 bunch cilantro'
- back
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM: 'Ingredients'
- extendedWaitUntil:
    visible: 'No store yet \(2\)'
    timeout: 15000
- tapOn: 'roma tomatoes.*'
- tapOn: "Macey's"
- tapOn: 'Produce'
- tapOn: 'Save'
- extendedWaitUntil:
    visible: "Macey's › Produce"
    timeout: 15000
- assertVisible: 'No store yet \(1\)'
- tapOn: 'No store yet \(1\)'
- assertVisible: 'cilantro.*'
- assertNotVisible: 'roma tomatoes.*'
