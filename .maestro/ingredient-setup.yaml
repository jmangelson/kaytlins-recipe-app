# Canonical ingredients: add another name (alias), choose preferred stores,
# override the area at one store, and merge a duplicate.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - ingredients
  - stores
---
- evalScript: ${output.email = 'setup' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: recipes
# Ingredients list shows the guessed category; open roma tomatoes.
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM: 'Ingredients'
- scrollUntilVisible:
    element: 'roma tomatoes, Produce · any store'
    timeout: 30000
- tapOn: 'roma tomatoes.*'
- extendedWaitUntil:
    visible:
      id: 'ingredient-name'
    timeout: 15000

# Prefer Costco, then Macey's.
- scrollUntilVisible:
    element: '\+ Costco'
- tapOn: '\+ Costco'
- scrollUntilVisible:
    element: "\\+ Macey's"
- tapOn: "\\+ Macey's"
- assertVisible: 'Prefer Costco less'

# At Costco, shelve it with the bakery (an override for that store only).
- scrollUntilVisible:
    element: 'Area in each store'
- scrollUntilVisible:
    element: 'Change'
- tapOn:
    text: 'Change'
    index: 0
- scrollUntilVisible:
    element: 'Bakery'
- tapOn: 'Bakery'
- scrollUntilVisible:
    element: 'Bakery · your choice'
    direction: UP
- tapOn: 'Save'
- extendedWaitUntil:
    visible: "roma tomatoes, Produce · Costco › Macey's"
    timeout: 15000

# Merge plum tomatoes into roma tomatoes; the Pico recipe follows.
- scrollUntilVisible:
    element: 'plum tomatoes.*'
    direction: UP
- tapOn: 'plum tomatoes.*'
- extendedWaitUntil:
    visible:
      id: 'ingredient-name'
    timeout: 15000
- scrollUntilVisible:
    element: 'Merge into another ingredient'
- tapOn: 'Merge into another ingredient'
- scrollUntilVisible:
    element: 'Use roma tomatoes'
- tapOn: 'Use roma tomatoes'
- tapOn: 'MERGE|Merge'
- extendedWaitUntil:
    visible: "roma tomatoes, Produce · Costco › Macey's"
    timeout: 15000
- assertNotVisible: 'plum tomatoes.*'

# "plum tomatoes" is now another name for roma tomatoes: a new recipe links it.
- tapOn: 'roma tomatoes.*'
- extendedWaitUntil:
    visible:
      id: 'ingredient-name'
    timeout: 15000
- scrollUntilVisible:
    element: 'Remove plum tomatoes'
- back
- back
- tapOn: 'Recipes'
- scrollUntilVisible:
    element: 'Pico'
- tapOn: 'Pico'
- extendedWaitUntil:
    visible: 'roma tomatoes'
    timeout: 15000
