# A recipe that includes another (a pie and its crust): set the batches,
# see it on both recipes, and a shopping list adds the crust's ingredients,
# scaled with the pie.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - recipes
---
- evalScript: ${output.email = 'includes' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: none
- runFlow:
    file: subflows/add-recipe.yaml
    env:
      NAME: 'Pie crust'
      TAG: 'Vegetarian'
      LINE1: '2 cups all-purpose flour'
      LINE2: '1 cup shortening'
- back
- runFlow:
    file: subflows/add-recipe.yaml
    env:
      NAME: 'Apple pie'
      TAG: 'Vegetarian'
      LINE1: '6 granny smith apples'
      LINE2: '1 cup granulated sugar'

# The pie includes half a batch of crust
- tapOn: 'Edit recipe'
- scrollUntilVisible:
    element: 'Include a recipe'
    centerElement: true
- tapOn: 'Include a recipe'
- inputText: 'crust'
- tapOn: 'Include Pie crust'
- scrollUntilVisible:
    element: '½ batch of Pie crust'
    centerElement: true
- tapOn: '½ batch of Pie crust'
- assertVisible: '½ batch of Pie crust'
- takeScreenshot: build/screenshots/122-includes-editor
- scrollUntilVisible:
    element: 'Save changes'
- tapOn: 'Save changes'
- runFlow: subflows/accept-save-anyway.yaml
- scrollUntilVisible:
    element: '½ batch of Pie crust.*'
    centerElement: true
- takeScreenshot: build/screenshots/123-recipe-includes
# The crust lists the pie it's part of
- tapOn: '½ batch of Pie crust.*'
- scrollUntilVisible:
    element: 'Included in'
    centerElement: true
- assertVisible: 'Apple pie'
- back
- back

# A list with the pie ×2 buys a whole batch of crust: 2 cups flour
- tapOn: 'Shopping'
- tapOn: 'New list'
- scrollUntilVisible:
    element: 'Add recipes'
    centerElement: true
- tapOn: 'Add recipes'
- tapOn:
    id: 'add-recipe-search'
- inputText: 'apple'
- hideKeyboard
- tapOn: 'Select Apple pie'
- scrollUntilVisible:
    element: 'Apple pie, ×1.*'
    centerElement: true
- tapOn: 'Apple pie, ×1.*'
- scrollUntilVisible:
    element: 'Add 1 recipe'
    centerElement: true
- tapOn: 'Add 1 recipe'
- scrollUntilVisible:
    element: 'Save list'
- tapOn: 'Save list'
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- scrollUntilVisible:
    element: '.*flour.*Need 2 cups.*Pie crust.*'
    centerElement: true
- assertVisible: '.*granny smith apples.*Need 12.*Apple pie.*'
- takeScreenshot: build/screenshots/124-list-with-crust
