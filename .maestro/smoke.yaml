# Smoke: app launches and every tab opens to its screen.
appId: com.jmangelson.kaytlinsrecipes
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'No recipes yet.*'
    timeout: 30000
- tapOn: 'Plans'
- assertVisible: 'Meal plans'
- tapOn: 'Calendar'
- assertVisible: 'Nothing scheduled.*'
- tapOn: 'Shopping'
- assertVisible: 'No shopping lists yet.*'
- tapOn: 'Recipes'
- assertVisible: 'No recipes yet.*'
