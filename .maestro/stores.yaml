# A new household gets the starter stores (with areas in walking order) and
# recipe tags; Stores & aisles opens from Settings and Back returns there.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - stores
---
- evalScript: ${output.email = 'stores' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: none
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Recipe tags'
    centerElement: true
- assertVisible: 'Type: Vegetarian, Chicken/Poultry, Fish/Seafood, Beef, Pork'
- assertVisible: 'Meal: Breakfast, Lunch, Dinner'
- tapOn: 'Stores & aisles'
- extendedWaitUntil:
    visible: "Macey's.*"
    timeout: 15000
- assertVisible: "Macey's, 16 areas"
- assertVisible: 'Costco, 11 areas'
- assertVisible: "Sam's Club, 11 areas"
- assertVisible: 'Walmart, 16 areas'
- assertVisible: "Smith's, 16 areas"
# Areas are listed in walking order on the store's own screen.
- tapOn: "Macey's.*"
- extendedWaitUntil:
    visible:
      id: 'store-name'
    timeout: 15000
- assertVisible: 'Produce'
- assertVisible: 'Bakery'
- back
- back
- assertVisible: 'Recipe tags'
