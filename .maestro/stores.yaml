# A new household gets the starter stores (with areas in walking order) and
# recipe tags; Stores & aisles opens from Settings and Back returns there.
appId: com.jmangelson.kaytlinsrecipes
---
- launchApp:
    clearState: true
- evalScript: ${output.email = 'stores' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/sign-in-test-user.yaml
    env:
      EMAIL: ${output.email}
- runFlow: subflows/create-household.yaml
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Chicken/Poultry'
    centerElement: true
- assertVisible: 'Vegetarian'
- assertVisible: 'Fish/Seafood'
- assertVisible: 'Beef'
- assertVisible: 'Pork'
- tapOn: 'Stores & aisles'
- extendedWaitUntil:
    visible: "Macey's.*"
    timeout: 15000
- assertVisible: "Macey's, 11 areas"
- assertVisible: 'Costco, 8 areas'
- assertVisible: "Sam's Club, 8 areas"
- assertVisible: 'Walmart, 11 areas'
- assertVisible: "Smith's, 11 areas"
# Areas are listed in walking order on the store's own screen.
- tapOn: "Macey's.*"
- extendedWaitUntil:
    visible:
      id: 'store-name'
    timeout: 15000
- assertVisible: 'Produce'
- assertVisible: 'Bakery'
- back
- back
- assertVisible: 'Recipe tags'
