# Edit a store (rename, add/reorder/remove areas, hide it), saving with the
# Save button and from the Back prompt, and add a new store.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - stores
---
- evalScript: ${output.email = 'storesedit' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: none
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM: 'Stores & aisles'
- tapOn: 'Costco.*'

# Rename
- extendedWaitUntil:
    visible:
      id: 'store-name'
    timeout: 15000
- tapOn:
    id: 'store-name'
- eraseText: 20
- inputText: 'Costco Wholesale'
- hideKeyboard

# Add an area, move it up, remove another
- scrollUntilVisible:
    element:
      id: 'new-area-name'
- tapOn:
    id: 'new-area-name'
- inputText: 'Bulk'
- hideKeyboard
- scrollUntilVisible:
    element: 'Add area'
- tapOn: 'Add area'
# Drag handles only show in reorder mode.
- assertNotVisible: 'Drag Bulk'
- scrollUntilVisible:
    element: 'Reorder areas'
    direction: UP
- tapOn: 'Reorder areas'
# Drag Uncategorized to the bottom, below the new Bulk area
- scrollUntilVisible:
    element: 'Drag Uncategorized'
    centerElement: true
- swipe:
    from: 'Drag Uncategorized'
    direction: DOWN
    duration: 1500
- takeScreenshot: build/screenshots/26c-store-drag-reorder
- scrollUntilVisible:
    element: 'Done reordering'
    direction: UP
- tapOn: 'Done reordering'
- scrollUntilVisible:
    element: 'Uncategorized'
    centerElement: true
- assertVisible:
    text: 'Uncategorized'
    below: 'Bulk'
- scrollUntilVisible:
    element: 'Remove Pantry'
    direction: UP
- tapOn: 'Remove Pantry'
- tapOn: 'REMOVE|Remove'
- assertNotVisible: 'Remove Pantry'

# Rename an area (Bakery, now 6th; a short name so the cursor lands at the
# end), then Save: everything above saves together.
- scrollUntilVisible:
    element: 'Area 6 name'
    direction: UP
- tapOn: 'Area 6 name'
- eraseText: 30
- inputText: 'Bakery & Bread'
- hideKeyboard
- tapOn: 'Save store'
- tapOn: 'Costco Wholesale.*'
- extendedWaitUntil:
    visible:
      id: 'store-name'
    timeout: 15000
- scrollUntilVisible:
    element: 'Bakery & Bread'

# Hide it
- scrollUntilVisible:
    element: 'Use on shopping lists'
    direction: UP
- tapOn:
    text: 'Use on shopping lists'
    index: 1
# Back asks; Save from there keeps the change.
- back
- tapOn: 'SAVE|Save'
- scrollUntilVisible:
    element: 'Hidden stores'
- scrollUntilVisible:
    element: 'Costco Wholesale.*'

# Add a store
- scrollUntilVisible:
    element:
      id: 'new-store-name'
- tapOn:
    id: 'new-store-name'
- inputText: "Trader Joe's"
- hideKeyboard
- scrollUntilVisible:
    element: 'Add store'
- tapOn: 'Add store'
- extendedWaitUntil:
    visible: 'No areas yet.*'
    timeout: 15000
- back
- scrollUntilVisible:
    element: "Trader Joe's.*"
# Store order changes by dragging in reorder mode, saved with Save order.
- assertNotVisible: 'Drag Trader Joe.s'
- scrollUntilVisible:
    element: 'Reorder stores'
    direction: UP
- tapOn: 'Reorder stores'
- scrollUntilVisible:
    element: 'Drag Trader Joe.s'
    centerElement: true
- swipe:
    from: 'Drag Trader Joe.s'
    direction: UP
    duration: 1500
- takeScreenshot: build/screenshots/24c-stores-drag-reorder
- scrollUntilVisible:
    element: 'Save order'
- tapOn: 'Save order'
- assertNotVisible: 'Drag Trader Joe.s'
- assertVisible: 'Reorder stores'
# Trader Joe's moved up above Macey's
- assertVisible:
    text: "Macey's.*"
    below: "Trader Joe's.*"
