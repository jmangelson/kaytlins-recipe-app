# Stores, areas, and categories only (quick screenshot review while
# iterating on layouts or categories): the store list, Macey's areas, an
# area's category picker, Costco, the ingredient list, an ingredient's
# category picker, categories on a recipe, and a new ingredient's category
# in the recipe form.
appId: com.jmangelson.kaytlinsrecipes
---
- evalScript: ${output.email = 'storestour' + Date.now() + '@test.dev'}
- runFlow:
    file: ../subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: recipes
- runFlow:
    file: ../subflows/open-settings-item.yaml
    env:
      ITEM: 'Stores & aisles'
- extendedWaitUntil:
    visible: "Macey's.*"
    timeout: 15000
- takeScreenshot: build/screenshots/s1-stores
- tapOn: "Macey's.*"
- extendedWaitUntil:
    visible:
      id: 'store-name'
    timeout: 15000
- takeScreenshot: build/screenshots/s2-maceys-top
- scrollUntilVisible:
    element: 'Pharmacy · Medicine & health'
    centerElement: true
- takeScreenshot: build/screenshots/s3-maceys-pharmacy
- scrollUntilVisible:
    element: 'Aisle 7 · Baking & spices'
    centerElement: true
- takeScreenshot: build/screenshots/s4-maceys-aisles
- takeScreenshot: build/screenshots/s4b-maceys-edit-categories-link
- tapOn: 'Categories in Aisle 7 · Baking & spices.*'
- scrollUntilVisible:
    element: 'Spices & seasonings'
    centerElement: true
- takeScreenshot: build/screenshots/s5-area-category-picker
- back
- tapOn: 'Costco.*'
- extendedWaitUntil:
    visible:
      id: 'store-name'
    timeout: 15000
- scrollUntilVisible:
    element: 'Cold produce room'
    centerElement: true
- takeScreenshot: build/screenshots/s6-costco-produce
- back
- back
- scrollUntilVisible:
    element: 'Ingredients'
    centerElement: true
- tapOn: 'Ingredients'
- extendedWaitUntil:
    visible: 'chicken breasts.*'
    timeout: 15000
- takeScreenshot: build/screenshots/s7-ingredients
- tapOn: 'chicken breasts.*'
- extendedWaitUntil:
    visible:
      id: 'ingredient-name'
    timeout: 15000
- scrollUntilVisible:
    element: 'Change category'
    centerElement: true
- takeScreenshot: build/screenshots/s8a-ingredient-category-field
- tapOn: 'Change category'
- scrollUntilVisible:
    element: 'Meat & seafood, Fresh meat'
    centerElement: true
- takeScreenshot: build/screenshots/s8-ingredient-category
- tapOn: 'Produce'
- scrollUntilVisible:
    element: 'Potatoes, onions & garlic'
    centerElement: true
- takeScreenshot: build/screenshots/s9-ingredient-category-open
- back
- back
- back

# Categories on a recipe's ingredients
- tapOn: 'Recipes'
- tapOn: 'Chicken Enchiladas.*'
- scrollUntilVisible:
    element: 'Ingredients'
    centerElement: true
- takeScreenshot: build/screenshots/s10-recipe-categories

# Editing the recipe: a line's category, changed right there
- tapOn: 'Edit'
- scrollUntilVisible:
    element: 'Edit 2 lb chicken breasts'
    centerElement: true
- tapOn: 'Edit 2 lb chicken breasts'
- scrollUntilVisible:
    element: 'Change category'
    centerElement: true
- takeScreenshot: build/screenshots/s10b-edit-line-category
- tapOn: 'Change category'
- scrollUntilVisible:
    element: 'Changes chicken breasts everywhere.*'
    centerElement: true
- takeScreenshot: build/screenshots/s10c-edit-line-category-picker
- back

# A new ingredient's category, guessed then chosen, in the recipe form
- back
- tapOn: 'Add recipe'
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
- tapOn:
    id: 'recipe-name'
- inputText: 'Chutney toast'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'recipe-add-ingredients'
- tapOn:
    id: 'recipe-add-ingredients'
- inputText: '1 jar mango chutney'
- pressKey: Enter
- inputText: '2 slices zorbleberry loaf'
- hideKeyboard
- scrollUntilVisible:
    element: 'Add to recipe'
- tapOn: 'Add to recipe'
- scrollUntilVisible:
    element: 'Edit 2 slices zorbleberry loaf'
    centerElement: true
- takeScreenshot: build/screenshots/s11-new-ingredient-rows
- tapOn: 'Edit 2 slices zorbleberry loaf'
- scrollUntilVisible:
    element: 'Change category'
    centerElement: true
- takeScreenshot: build/screenshots/s12-new-ingredient-category
- tapOn: 'Change category'
- scrollUntilVisible:
    element: 'Standard bread, tortillas & PB&J'
    centerElement: true
- takeScreenshot: build/screenshots/s12b-new-ingredient-departments
- tapOn: 'Standard bread, tortillas & PB&J'
- tapOn: 'Standard bread & buns'
# The list closes when she picks, so the line's Done is above now.
- scrollUntilVisible:
    element: 'Done'
    direction: UP
    centerElement: true
- takeScreenshot: build/screenshots/s12c-new-ingredient-picked
- tapOn: 'Done'
- scrollUntilVisible:
    element: 'Edit 2 slices zorbleberry loaf'
    centerElement: true
- assertVisible: 'Standard bread & buns'
- takeScreenshot: build/screenshots/s13-new-ingredient-chosen
- back
- tapOn: 'DISCARD|Discard'
