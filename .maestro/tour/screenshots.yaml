# Captures a screenshot of each screen for review (not an assertion suite;
# lives outside .maestro/ top level so `npm run e2e` skips it).
# Run: maestro test .maestro/tour/screenshots.yaml  (screenshots land under the test output dir)
appId: com.jmangelson.kaytlinsrecipes
---
- launchApp:
    clearState: true
- evalScript: ${output.email = 'tour' + Date.now() + '@test.dev'}
- extendedWaitUntil:
    visible: 'Sign in with Google'
    timeout: 60000
- takeScreenshot: build/screenshots/01-sign-in
- runFlow:
    file: ../subflows/sign-in-test-user.yaml
    env:
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible: 'Set up your household'
    timeout: 30000
- takeScreenshot: build/screenshots/02-household-setup
- tapOn: 'Invite code'
- inputText: 'ZZZZ-9999'
- hideKeyboard
- tapOn: 'Join household'
- extendedWaitUntil:
    visible: "That invite code wasn't found.*"
    timeout: 15000
- takeScreenshot: build/screenshots/03-invite-code-not-found
- tapOn: 'Create household'
- extendedWaitUntil:
    visible: 'No recipes yet.*'
    timeout: 30000
- takeScreenshot: build/screenshots/04-recipes
- tapOn: 'Plans'
- takeScreenshot: build/screenshots/05-plans
- tapOn: 'Calendar'
- takeScreenshot: build/screenshots/06-calendar
- tapOn: 'Shopping'
- takeScreenshot: build/screenshots/07-shopping
- tapOn: 'Settings'
- assertVisible: 'Our Kitchen'
- scrollUntilVisible:
    element: 'Recipe tags'
    centerElement: true
- takeScreenshot: build/screenshots/08-settings
- scrollUntilVisible:
    element: 'Sign out'
- takeScreenshot: build/screenshots/09-settings-scrolled
- scrollUntilVisible:
    element: 'Stores & aisles'
    direction: UP
- tapOn: 'Stores & aisles'
- extendedWaitUntil:
    visible: "Macey's"
    timeout: 15000
- takeScreenshot: build/screenshots/10-stores
- scrollUntilVisible:
    element: 'Costco'
    centerElement: true
- takeScreenshot: build/screenshots/11-stores-costco
- scrollUntilVisible:
    element: "Smith's"
- scroll
- takeScreenshot: build/screenshots/12-stores-bottom

# Recipes (Milestone 3)
- back
- tapOn: 'Recipes'
- tapOn: 'Add recipe'
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
- takeScreenshot: build/screenshots/13-recipe-form-empty
- scrollUntilVisible:
    element: 'Save recipe'
- tapOn: 'Save recipe'
- runFlow: ../subflows/accept-save-anyway.yaml
- takeScreenshot: build/screenshots/14-recipe-form-save-error
- scrollUntilVisible:
    element:
      id: 'recipe-name'
    direction: UP
- takeScreenshot: build/screenshots/14b-recipe-form-name-error
- tapOn:
    id: 'recipe-name'
- inputText: 'Chicken Enchiladas'
- hideKeyboard
- tapOn: 'Chicken/Poultry'
- scrollUntilVisible:
    element: 'Main dish'
- tapOn: 'Main dish'
- scrollUntilVisible:
    element: 'Dinner'
- tapOn: 'Dinner'
- takeScreenshot: build/screenshots/14c-recipe-form-tag-groups
- scrollUntilVisible:
    element:
      id: 'recipe-add-ingredients'
- tapOn:
    id: 'recipe-add-ingredients'
- inputText: '2 lbs chicken breasts'
- pressKey: Enter
- inputText: '1 (10 oz) can red enchilada sauce'
- pressKey: Enter
- inputText: '8 flour tortillas'
- pressKey: Enter
- inputText: '2 cups shredded Monterey Jack, divided'
- pressKey: Enter
- inputText: '1 medium onion, diced'
- pressKey: Enter
- inputText: 'Salt to taste'
- hideKeyboard
- takeScreenshot: build/screenshots/15-recipe-form-paste
- scrollUntilVisible:
    element: 'Add to recipe'
- tapOn: 'Add to recipe'
- scrollUntilVisible:
    element: 'Edit 1 can red enchilada sauce, 10 oz'
    direction: UP
    centerElement: true
- takeScreenshot: build/screenshots/15b-recipe-form-rows
- tapOn: 'Edit 2 lb chicken breasts'
- takeScreenshot: build/screenshots/15c-row-editor
- scrollUntilVisible:
    element: 'Done'
- takeScreenshot: build/screenshots/15d-row-editor-bottom
- tapOn: 'Done'
- takeScreenshot: build/screenshots/15e-row-closed
- runFlow: ../subflows/choose-recipe-photo.yaml
- takeScreenshot: build/screenshots/16-recipe-form-photo
- scrollUntilVisible:
    element: 'Save recipe'
- tapOn: 'Save recipe'
- runFlow: ../subflows/accept-save-anyway.yaml
- extendedWaitUntil:
    visible: 'Edit recipe'
    timeout: 15000
- scrollUntilVisible:
    element: 'Photo of Chicken Enchiladas'
    direction: UP
- takeScreenshot: build/screenshots/17-recipe-detail
- scrollUntilVisible:
    element: 'Delete recipe'
- takeScreenshot: build/screenshots/18-recipe-detail-bottom
- back
- runFlow:
    file: ../subflows/add-recipe.yaml
    env:
      NAME: 'Veggie Pasta'
      TAG: 'Vegetarian'
      LINE1: '1 lb penne'
      LINE2: '1 jar marinara'
- back
- extendedWaitUntil:
    visible: '2 recipes'
    timeout: 15000
- takeScreenshot: build/screenshots/19-recipes-list
- tapOn: 'Show filters'
- tapOn: 'Vegetarian'
- takeScreenshot: build/screenshots/20-recipes-filters-open
- tapOn: 'Hide filters'
- takeScreenshot: build/screenshots/20b-recipes-filtered
- tapOn: 'Remove filter Vegetarian'
- tapOn:
    id: 'recipe-search'
- inputText: 'zzz'
- hideKeyboard
- takeScreenshot: build/screenshots/21-recipes-no-match
- tapOn:
    id: 'recipe-search'
- eraseText: 5
- hideKeyboard

# A vague line asks which ingredient it means (Milestone 4b)
- tapOn: 'Add recipe'
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
- tapOn:
    id: 'recipe-name'
- inputText: 'French Onion Soup'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'recipe-add-ingredients'
- tapOn:
    id: 'recipe-add-ingredients'
- inputText: '3 sweet onions, sliced'
- pressKey: Enter
- inputText: '4 cups beef broth'
- hideKeyboard
- scrollUntilVisible:
    element: 'Add to recipe'
- tapOn: 'Add to recipe'
- scrollUntilVisible:
    element: 'Which ingredient is.*'
    direction: UP
    centerElement: true
- takeScreenshot: build/screenshots/21b-recipe-vague-match
- tapOn: 'New: sweet onions'
- back

# Settings and shopping setup (Milestone 4)
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Household settings'
    direction: UP
- scrollUntilVisible:
    element: 'Mangelson Kitchen|Our Kitchen'
    direction: UP
- takeScreenshot: build/screenshots/22-settings-top
- tapOn: 'Household settings'
- extendedWaitUntil:
    visible:
      id: 'household-name'
    timeout: 15000
- takeScreenshot: build/screenshots/23-household-settings
- back
- scrollUntilVisible:
    element: 'Stores & aisles'
    centerElement: true
- tapOn: 'Stores & aisles'
- extendedWaitUntil:
    visible: "Macey's.*"
    timeout: 15000
- takeScreenshot: build/screenshots/24-stores
- tapOn: "Macey's.*"
- extendedWaitUntil:
    visible:
      id: 'store-name'
    timeout: 15000
- takeScreenshot: build/screenshots/25-store-edit
- tapOn: 'Categories in Bakery.*'
- takeScreenshot: build/screenshots/25b-store-area-categories
- tapOn: 'Categories in Bakery.*'
- scrollUntilVisible:
    element: 'Add area'
- takeScreenshot: build/screenshots/26-store-edit-bottom
- back
- scrollUntilVisible:
    element:
      id: 'new-store-name'
- tapOn:
    id: 'new-store-name'
- inputText: 'costco'
- hideKeyboard
- scrollUntilVisible:
    element: 'Add store'
- tapOn: 'Add store'
- scrollUntilVisible:
    element: 'There.s already a store.*'
    centerElement: true
- takeScreenshot: build/screenshots/27-store-duplicate-name
- back
- scrollUntilVisible:
    element: 'Ingredients'
    centerElement: true
- tapOn: 'Ingredients'
- extendedWaitUntil:
    visible: 'chicken breasts.*'
    timeout: 15000
- takeScreenshot: build/screenshots/28-ingredients
- tapOn: 'chicken breasts.*'
- extendedWaitUntil:
    visible:
      id: 'ingredient-name'
    timeout: 15000
- takeScreenshot: build/screenshots/29-ingredient-edit
- scrollUntilVisible:
    element: '\+ Costco'
- tapOn: '\+ Costco'
- scrollUntilVisible:
    element: "\\+ Macey's"
- tapOn: "\\+ Macey's"
- scrollUntilVisible:
    element: 'Where to buy it'
    centerElement: true
- takeScreenshot: build/screenshots/29b-ingredient-stores
- scrollUntilVisible:
    element: 'Area in each store'
    centerElement: true
- takeScreenshot: build/screenshots/29c-ingredient-areas
- tapOn: 'Save'
- extendedWaitUntil:
    visible: "chicken breasts, Meat & Seafood · Costco › Macey's"
    timeout: 15000
- takeScreenshot: build/screenshots/30-ingredients-assigned
- back
- scrollUntilVisible:
    element: 'Manage tags'
    centerElement: true
- tapOn: 'Manage tags'
- extendedWaitUntil:
    visible: 'Pork tag name'
    timeout: 15000
- takeScreenshot: build/screenshots/31-tags

# Meal plans (Milestone 5)
- back
- tapOn: 'Plans'
- takeScreenshot: build/screenshots/32-plans-empty
- tapOn: 'New plan'
- tapOn:
    id: 'plan-name'
- inputText: 'Week A'
- hideKeyboard
- takeScreenshot: build/screenshots/33-plan-new
- tapOn: 'Create plan'
- extendedWaitUntil:
    visible: '7 days · 0 recipes'
    timeout: 15000
- takeScreenshot: build/screenshots/34-plan-editor-empty
- scrollUntilVisible:
    element: 'Add to Day 1 Dinner'
- tapOn: 'Add to Day 1 Dinner'
- extendedWaitUntil:
    visible: 'Add Chicken Enchiladas'
    timeout: 15000
- takeScreenshot: build/screenshots/35-plan-picker-main
- tapOn: 'Add Chicken Enchiladas'
- scrollUntilVisible:
    element: 'Add a side to Day 1 Dinner'
- takeScreenshot: build/screenshots/36-plan-day-with-main
- tapOn: 'Add a side to Day 1 Dinner'
- takeScreenshot: build/screenshots/37-plan-picker-sides
- tapOn: 'All'
- extendedWaitUntil:
    visible: 'Add Veggie Pasta'
    timeout: 15000
- takeScreenshot: build/screenshots/38-plan-picker-all
- tapOn: 'Add Veggie Pasta'
- back
- extendedWaitUntil:
    visible: 'Week A.*'
    timeout: 15000
- takeScreenshot: build/screenshots/39-plans-list

# Calendar (Milestone 6)
- tapOn: 'Calendar'
- takeScreenshot: build/screenshots/40-calendar-empty
- tapOn: 'Apply a plan'
- takeScreenshot: build/screenshots/41-apply-choose
- tapOn: 'Use Week A'
- extendedWaitUntil:
    visible: 'Week A → .*'
    timeout: 15000
- scrollUntilVisible:
    element: 'Apply to calendar'
- takeScreenshot: build/screenshots/42-apply-preview
- tapOn: 'Apply to calendar'
- extendedWaitUntil:
    visible: 'Dinner: Chicken Enchiladas, Veggie Pasta'
    timeout: 15000
- takeScreenshot: build/screenshots/43-calendar-week
- tapOn:
    text: 'Dinner: Chicken Enchiladas, Veggie Pasta'
    index: 0
- extendedWaitUntil:
    visible: 'From Week A.*'
    timeout: 15000
- takeScreenshot: build/screenshots/44-calendar-day
- back
- tapOn: 'Apply a plan'
- tapOn: 'Use Week A'
- extendedWaitUntil:
    visible: '.* already ha.* meals.*'
    timeout: 15000
- scrollUntilVisible:
    element: 'Apply to calendar'
- takeScreenshot: build/screenshots/45-apply-conflict
- back

# Shopping (Milestone 7)
- runFlow: shopping-part.yaml
