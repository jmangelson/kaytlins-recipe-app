# A recipe line that takes either of two ingredients ("iceberg or romaine
# lettuce"): parsed into a first choice and another, shown on the recipe,
# editable, and on a shopping list as one item with its other choice.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - recipes
---
- evalScript: ${output.email = 'choices' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: none
- runFlow:
    file: subflows/add-recipe.yaml
    env:
      NAME: 'Taco salad'
      TAG: 'Vegetarian'
      LINE1: '1 head iceberg or romaine lettuce'
      LINE2: '1 cup white or brown rice'
- assertVisible: 'iceberg lettuce or romaine lettuce'
- assertVisible: 'white rice or brown rice'
- takeScreenshot: build/screenshots/110-recipe-choices

# In the editor: the other choice under the line, and "Other options"
- tapOn: 'Edit recipe'
- scrollUntilVisible:
    element: 'Edit 1 head iceberg lettuce or romaine lettuce'
    centerElement: true
- takeScreenshot: build/screenshots/111-edit-choices
- tapOn: 'Edit 1 head iceberg lettuce or romaine lettuce'
- scrollUntilVisible:
    element: 'Other options'
    centerElement: true
- assertVisible: 'Lists buy the first, unless one of these is already on the list.'
- takeScreenshot: build/screenshots/112-or-instead
# Typing in Note, then adding a choice: typing goes to the search, not the
# note, and the search shows above the keyboard
- scrollUntilVisible:
    element:
      id: 'row-note'
    direction: UP
    centerElement: true
- tapOn:
    id: 'row-note'
- inputText: 'chopped'
# (with the keyboard up, scroll the button above it, as she would)
- swipe:
    start: 50%, 55%
    end: 50%, 25%
- swipe:
    start: 50%, 55%
    end: 50%, 25%
- tapOn: 'Add an option'
- inputText: 'green leaf lettuce'
- takeScreenshot: build/screenshots/114-add-choice-typing
- assertVisible:
    id: 'ingredient-picker-search'
    text: 'green leaf lettuce'
- tapOn: 'New ingredient green leaf lettuce'
- assertVisible: 'or green leaf lettuce'
- scrollUntilVisible:
    element:
      id: 'row-note'
    direction: UP
    centerElement: true
- assertVisible:
    id: 'row-note'
    text: 'chopped'
- back
- runFlow:
    when:
      visible: 'Save your changes\?'
    commands:
      - tapOn: 'DISCARD|Discard'
- back

# A shopping list buys the first choice and shows the other
- tapOn: 'Shopping'
- tapOn: 'New list'
- scrollUntilVisible:
    element: 'Add a recipe'
    centerElement: true
- tapOn: 'Add a recipe'
- tapOn:
    id: 'add-recipe-search'
- inputText: 'romaine'
- hideKeyboard
- tapOn: 'Add Taco salad'
- scrollUntilVisible:
    element: 'Save list'
- tapOn: 'Save list'
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- scrollUntilVisible:
    element: 'iceberg lettuce \(or romaine lettuce\).*'
    centerElement: true
- takeScreenshot: build/screenshots/113-list-choices
