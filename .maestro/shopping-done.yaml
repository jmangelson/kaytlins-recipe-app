# In the store: fix one item's aisle (this store only, then its category),
# then check everything off and finish the trip.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - shopping
---
- evalScript: ${output.email = 'done' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: week
- tapOn: 'Shopping'
- tapOn: 'New list'
- extendedWaitUntil:
    visible: '.*Dinner, Chicken Enchiladas, Pico'
    timeout: 15000
# Just the enchiladas and pico: 5 items
- tapOn: '.*Dinner, Veggie Pasta'
- scrollUntilVisible:
    element: 'Save list'
- tapOn: 'Save list'
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- scrollUntilVisible:
    element: 'Shop at Macey.s'
- tapOn: 'Shop at Macey.s'
- scrollUntilVisible:
    element: 'Make list'
- tapOn: 'Make list'
- extendedWaitUntil:
    visible: '5 to buy at .*'
    timeout: 15000

# The fix is out of the way until she asks for it
- assertNotVisible: 'Where does .* go\?'
- tapOn: 'Fix an item'
- assertVisible: 'Tap the item to fix.'
- takeScreenshot: build/screenshots/80-fix-aisle-picking
- tapOn: 'lime.*'
# Tapping picked it for the fix instead of checking it off
- assertVisible:
    text: 'lime.*'
    checked: false
- assertVisible: 'What needs fixing for lime\?'
- takeScreenshot: build/screenshots/80b-fix-item-choices
- tapOn: 'Where it is in the store'
- assertVisible: 'Where does lime go\?'
- takeScreenshot: build/screenshots/81-fix-aisle-choices
- assertVisible: 'The category for lime is Fruit.'
- scrollUntilVisible:
    element: 'At Macey.s, just lime is somewhere else'
    centerElement: true
- tapOn: 'At Macey.s, just lime is somewhere else'
- scrollUntilVisible:
    element: 'PB&J'
    centerElement: true
- takeScreenshot: build/screenshots/82-fix-aisle-areas
- tapOn: 'PB&J'
- assertNotVisible: 'Where does lime go\?'
- scrollUntilVisible:
    element: 'lime.*'
    direction: UP
    centerElement: true
- assertVisible:
    text: 'lime.*'
    below: 'PB&J'

# Its category, fixed everywhere (the button is at the top of the list)
- scrollUntilVisible:
    element: 'Fix an item'
    direction: UP
- tapOn: 'Fix an item'
- tapOn: 'flour tortillas.*'
- tapOn: 'Where it is in the store'
- scrollUntilVisible:
    element: 'The category is wrong'
    centerElement: true
- tapOn: 'The category is wrong'
- takeScreenshot: build/screenshots/83-fix-aisle-category
- scrollUntilVisible:
    element: 'Dairy, cheese & eggs'
    centerElement: true
- tapOn: 'Dairy, cheese & eggs'
- tapOn: 'Refrigerated dough & dips'
- assertNotVisible: 'Where does flour tortillas go\?'

# The category is right, but this store keeps all of it elsewhere
- scrollUntilVisible:
    element: 'Fix an item'
    direction: UP
- tapOn: 'Fix an item'
- tapOn: 'plum tomatoes.*'
- tapOn: 'Where it is in the store'
- scrollUntilVisible:
    element: 'The category is right, but at Macey.s all of Greens & vegetables is somewhere else'
    centerElement: true
- takeScreenshot: build/screenshots/81b-fix-aisle-three-choices
- tapOn: 'The category is right, but at Macey.s all of Greens & vegetables is somewhere else'
- scrollUntilVisible:
    element: 'Fresh meat & seafood'
    centerElement: true
- takeScreenshot: build/screenshots/83b-fix-aisle-category-area
- tapOn: 'Fresh meat & seafood'
- assertNotVisible: 'Where does plum tomatoes go\?'
- scrollUntilVisible:
    element: 'plum tomatoes.*'
    direction: UP
    centerElement: true
- assertVisible:
    text: 'plum tomatoes.*'
    below: 'Fresh meat & seafood'

# Each fixed item sits in its new area (Macey's order: PB&J, Fresh meat &
# seafood, Dairy, then the aisles)
# (the list ends here, so scroll up to the headings rather than center rows)
- scrollUntilVisible:
    element: 'PB&J'
    direction: UP
    centerElement: true
- assertVisible:
    text: 'lime.*'
    below: 'PB&J'
    above: 'Fresh meat & seafood'
- assertVisible:
    text: 'plum tomatoes.*'
    below: 'Fresh meat & seafood'
    above: 'Dairy'
- scrollUntilVisible:
    element: 'Aisle 9.*'
- assertVisible:
    text: 'flour tortillas.*'
    below: 'Dairy'
    above: 'Aisle 9.*'

# Done shopping with items left asks first
- scrollUntilVisible:
    element: 'Done shopping'
- tapOn: 'Done shopping'
- extendedWaitUntil:
    visible: 'Finish the trip\?'
    timeout: 5000
- assertVisible: '5 items aren’t checked off.*'
- takeScreenshot: build/screenshots/84a-finish-early-prompt
- tapOn: 'KEEP SHOPPING|Keep shopping'

# Everything in the cart: done shopping?
- scrollUntilVisible:
    element: 'Fix an item'
    direction: UP
- scrollUntilVisible:
    element: 'lime.*'
    centerElement: true
- tapOn: 'lime.*'
- scrollUntilVisible:
    element: 'chicken breasts.*'
    centerElement: true
- tapOn: 'chicken breasts.*'
- scrollUntilVisible:
    element: 'red enchilada sauce.*'
    centerElement: true
- tapOn: 'red enchilada sauce.*'
- scrollUntilVisible:
    element: 'flour tortillas.*'
    centerElement: true
- tapOn: 'flour tortillas.*'
- scrollUntilVisible:
    element: 'plum tomatoes.*'
    centerElement: true
- tapOn: 'plum tomatoes.*'
- extendedWaitUntil:
    visible: 'Everything’s in the cart'
    timeout: 5000
- takeScreenshot: build/screenshots/84-done-shopping-prompt
- tapOn: 'NEED MORE ITEMS|Need more items'
# The Done shopping button finishes it later (here: back out first)
- scrollUntilVisible:
    element: 'Done shopping'
- takeScreenshot: build/screenshots/84b-done-shopping-button
- scrollUntilVisible:
    element: '5 of 5 in the cart.*'
    direction: UP
# Unchecking and checking again asks again
- scrollUntilVisible:
    element: 'plum tomatoes.*'
    centerElement: true
- tapOn: 'plum tomatoes.*'
- tapOn: 'plum tomatoes.*'
- extendedWaitUntil:
    visible: 'Everything’s in the cart'
    timeout: 5000
- tapOn: 'DONE SHOPPING|Done shopping'
- extendedWaitUntil:
    visible: 'Finished trips'
    timeout: 15000
- assertVisible: '.*Done shopping'
- takeScreenshot: build/screenshots/85-finished-trips

# The fixes were saved, not just shown on this list
- tapOn: 'Settings'
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM: 'Ingredients'
# The wrong category, fixed everywhere
- scrollUntilVisible:
    element: 'flour tortillas, Refrigerated dough & dips.*'
    centerElement: true
# Just lime, just at Macey's
- scrollUntilVisible:
    element: 'lime.*'
    centerElement: true
- tapOn: 'lime.*'
- scrollUntilVisible:
    element: 'PB&J · your choice'
    centerElement: true
# Its category is still Fruit (only Macey's changed for it)
- scrollUntilVisible:
    element: 'Fruit'
    direction: UP
    centerElement: true
- back
- back
# All of Greens & vegetables, moved in Macey's layout
- scrollUntilVisible:
    element: 'Stores & aisles'
    centerElement: true
- tapOn: 'Stores & aisles'
- tapOn: "Macey's.*"
- extendedWaitUntil:
    visible:
      id: 'store-name'
    timeout: 15000
- scrollUntilVisible:
    element: 'Categories in Produce · Greens & vegetables: none'
    centerElement: true
- scrollUntilVisible:
    element: 'Categories in Fresh meat & seafood: .*Greens & vegetables.*'
    centerElement: true
- takeScreenshot: build/screenshots/86-fix-saved-to-store
- back
- back

# A new list places them the new way too (Settings has a "Shopping"
# heading too, so go by way of Recipes)
- tapOn: 'Recipes'
- tapOn: 'Shopping'
- tapOn: 'New list'
- extendedWaitUntil:
    visible: '.*Dinner, Chicken Enchiladas, Pico'
    timeout: 15000
- tapOn: '.*Dinner, Veggie Pasta'
- scrollUntilVisible:
    element: 'Save list'
- tapOn: 'Save list'
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- scrollUntilVisible:
    element: 'Shop at Macey.s'
- tapOn: 'Shop at Macey.s'
- scrollUntilVisible:
    element: 'Make list'
- tapOn: 'Make list'
- extendedWaitUntil:
    visible: '5 to buy at .*'
    timeout: 15000
- scrollUntilVisible:
    element: 'lime.*'
    centerElement: true
- assertVisible:
    text: 'lime.*'
    below: 'PB&J'
    above: 'Fresh meat & seafood'
- scrollUntilVisible:
    element: 'plum tomatoes.*'
    centerElement: true
- assertVisible:
    text: 'plum tomatoes.*'
    below: 'Fresh meat & seafood'
    above: 'Dairy'
- scrollUntilVisible:
    element: 'flour tortillas.*'
    centerElement: true
- assertVisible:
    text: 'flour tortillas.*'
    below: 'Dairy'
    above: 'Aisle 9.*'
- takeScreenshot: build/screenshots/87-new-list-after-fixes
