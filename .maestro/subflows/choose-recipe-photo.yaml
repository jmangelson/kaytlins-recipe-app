# From a recipe form, adds the first gallery photo (multi-select picker).
# Needs a gallery image (scripts/e2e-setup.sh).
appId: com.jmangelson.kaytlinsrecipes
---
- scrollUntilVisible:
    element: 'Choose photos'
    centerElement: true
- tapOn: 'Choose photos'
- tapOn: 'Photo taken on.*'
- tapOn: 'Add \(1\)'
- scrollUntilVisible:
    element: 'Remove photo .*'
