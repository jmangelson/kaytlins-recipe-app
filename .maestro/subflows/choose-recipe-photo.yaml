# From a recipe form, adds the first gallery photo and accepts the crop.
# Needs a gallery image (scripts/e2e-setup.sh).
appId: com.jmangelson.kaytlinsrecipes
---
- scrollUntilVisible:
    element: 'Choose photo'
    centerElement: true
- tapOn: 'Choose photo'
- tapOn: 'Photo taken on.*'
- tapOn:
    id: 'crop_image_menu_crop'
- scrollUntilVisible:
    element: 'Remove photo .*'
