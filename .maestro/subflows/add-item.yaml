# Types an item into "Add an item" and taps Add to list, centering the
# button first so a floating button can't cover it. Params: TEXT
appId: com.jmangelson.kaytlinsrecipes
---
- scrollUntilVisible:
    element:
      id: 'add-item'
    centerElement: true
- tapOn:
    id: 'add-item'
- inputText: ${TEXT}
- hideKeyboard
# Its own button (the Staples section has another "Add to list").
- scrollUntilVisible:
    element:
      id: 'add-item-submit'
    centerElement: true
- tapOn:
    id: 'add-item-submit'
