# Signs in with the emulator-only test sign-in. Requires Metro started with
# EXPO_PUBLIC_USE_FIREBASE_EMULATORS=1 and `npm run emulators` running.
# Params: EMAIL
appId: com.jmangelson.kaytlinsrecipes
---
- extendedWaitUntil:
    visible: 'Sign in with Google'
    timeout: 60000
- scrollUntilVisible:
    element: 'Test email'
- tapOn: 'Test email'
- inputText: ${EMAIL}
- hideKeyboard
# The button moves while the keyboard closes; wait for it to settle and retry
# the tap if the screen doesn't react.
- extendedWaitUntil:
    visible: 'Test sign in'
    timeout: 5000
- tapOn:
    text: 'Test sign in'
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: 'Sign in with Google'
    timeout: 30000
