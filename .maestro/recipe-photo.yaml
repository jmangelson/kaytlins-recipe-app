# Add a photo to a recipe from the gallery, see it on the detail screen, then
# remove it.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - recipes
---
- evalScript: ${output.email = 'photo' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: recipes
- scrollUntilVisible:
    element: 'Veggie Pasta'
- tapOn: 'Veggie Pasta'
- tapOn: 'Edit recipe'
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
- runFlow: subflows/choose-recipe-photo.yaml
- scrollUntilVisible:
    element: 'Save changes'
- tapOn: 'Save changes'
- runFlow: subflows/accept-save-anyway.yaml
- extendedWaitUntil:
    visible: 'Photo of Veggie Pasta'
    timeout: 15000
- tapOn: 'Edit recipe'
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
- scrollUntilVisible:
    element: 'Remove photo'
- tapOn: 'Remove photo'
- scrollUntilVisible:
    element: 'Save changes'
- tapOn: 'Save changes'
- runFlow: subflows/accept-save-anyway.yaml
- extendedWaitUntil:
    visible: 'Edit recipe'
    timeout: 15000
- assertNotVisible: 'Photo of Veggie Pasta'
