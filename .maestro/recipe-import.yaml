# Import a recipe from a website link: the form fills in for review, the
# link is kept with the recipe, and the recipe page opens it.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - recipes
---
- evalScript: ${output.email = 'import' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: none
- tapOn: 'Add recipe'
- tapOn: 'Import from a website'
- extendedWaitUntil:
    visible:
      id: 'import-url'
    timeout: 15000
- tapOn:
    id: 'import-url'
- inputText: 'example.com/sheet-pan-fajitas'
- hideKeyboard
- takeScreenshot: build/screenshots/90-import-link
- tapOn: 'Import recipe'
- extendedWaitUntil:
    visible: 'Filled in from the website.*'
    timeout: 15000
- takeScreenshot: build/screenshots/91-import-filled
- assertVisible: 'Sheet Pan Chicken Fajitas'
- scrollUntilVisible:
    element: 'Edit 1 ½ lb boneless skinless chicken breasts, sliced'
- scrollUntilVisible:
    element: 'Save recipe'
- tapOn: 'Save recipe'
- runFlow: subflows/accept-save-anyway.yaml
- extendedWaitUntil:
    visible: 'Edit recipe'
    timeout: 15000
- scrollUntilVisible:
    element: 'View the original recipe'
    centerElement: true
- takeScreenshot: build/screenshots/92-import-saved-link
