# Filter recipes by tag and search by ingredient, including the no-match state.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - recipes
---
- evalScript: ${output.email = 'filter' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: recipes
- extendedWaitUntil:
    visible: '4 recipes'
    timeout: 15000

# Tag filter (filters open from the Filters chip)
- tapOn: 'Show filters'
- tapOn: 'Vegetarian'
- scrollUntilVisible:
    element: '3 of 4 recipes'
- scrollUntilVisible:
    element: 'Veggie Pasta'
- assertNotVisible: 'Chicken Enchiladas'
- scrollUntilVisible:
    element: 'Vegetarian'
    direction: UP
- tapOn: 'Vegetarian'
- scrollUntilVisible:
    element: 'Hide filters'
    direction: UP
- tapOn: 'Hide filters'
- assertVisible: '4 recipes'

# Search by ingredient
- scrollUntilVisible:
    element:
      id: 'recipe-search'
    direction: UP
- tapOn:
    id: 'recipe-search'
- inputText: 'tortilla'
- hideKeyboard
- assertVisible: 'Chicken Enchiladas'
- assertNotVisible: 'Veggie Pasta'

# No matches, then clear
- tapOn:
    id: 'recipe-search'
- eraseText: 20
- inputText: 'zzz'
- hideKeyboard
- assertVisible: 'No recipes match.'
- tapOn: 'Clear search and filters'
- assertVisible: '4 recipes'
