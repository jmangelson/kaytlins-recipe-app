# Make a shopping list from this week's calendar: leave out a meal, check the
# pantry (have one item, some of another), make the list by store and area,
# check an item off, go back to the pantry check, and build one from a plan.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - shopping
  - quick
---
- evalScript: ${output.email = 'shopping' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: week
- tapOn: 'Shopping'
- assertVisible: 'No shopping lists yet.'

# This week has Week A on it: day 1 enchiladas + pico, day 2 pasta
- tapOn: 'New list'
- extendedWaitUntil:
    visible: '.*Dinner, Chicken Enchiladas, Pico'
    timeout: 15000
- scrollUntilVisible:
    element: '2 meals · 7 items.*'
- scrollUntilVisible:
    element: '.*Dinner, Veggie Pasta'
    direction: UP
- tapOn: '.*Dinner, Veggie Pasta'
- scrollUntilVisible:
    element: '1 meal · 5 items.*'
- scrollUntilVisible:
    element: 'Save list'
- tapOn: 'Save list'

# Pantry check
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- assertVisible: '5 of 5 to buy.'
- tapOn: 'Have lime.*'
- assertVisible: '4 of 5 to buy.'
- tapOn: 'Have some chicken breasts'
- tapOn:
    id: 'have-chicken breasts'
- inputText: '1/2'
- assertVisible: 'Buy 1 ½ lb'
- hideKeyboard
- scrollUntilVisible:
    element: 'Shop at Macey.s'
- tapOn: 'Shop at Macey.s'
- tapOn: 'Shop at Costco'
- scrollUntilVisible:
    element: 'Make list'
- assertVisible: 'Shop at Costco'
- tapOn: 'Make list'

# The list, grouped by store and area
- extendedWaitUntil:
    visible: '4 to buy at .*'
    timeout: 15000
- assertVisible: 'chicken breasts.*1 ½ lb.*'
- assertNotVisible: 'lime.*'
- tapOn: 'chicken breasts.*'
- assertVisible: '1 of 4 in the cart\..*'
- back
- extendedWaitUntil:
    visible: '1 of 4 in the cart'
    timeout: 15000

# Back to the pantry check keeps her answers
- tapOn: '.*1 of 4 in the cart'
- scrollUntilVisible:
    element: 'Back to pantry check'
- tapOn: 'Back to pantry check'
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- assertVisible:
    text: 'Have lime.*'
    checked: true
- assertVisible: 'Buy 1 ½ lb'
- back

# From a meal plan instead
- tapOn: 'New list'
# (any mix: calendar off, a plan, plus a recipe from the drop-down)
- extendedWaitUntil:
    visible: '.*Dinner, Chicken Enchiladas, Pico'
    timeout: 15000
- tapOn: 'Use calendar days'
- assertNotVisible: '.*Dinner, Chicken Enchiladas, Pico'
- scrollUntilVisible:
    element: 'Shop for Week A'
- tapOn: 'Shop for Week A'
- scrollUntilVisible:
    element: '2 meals · 7 items.*'
- scrollUntilVisible:
    element: 'Add a recipe'
    centerElement: true
- tapOn: 'Add a recipe'
- tapOn:
    id: 'add-recipe-search'
# Search by ingredient, with the Recipes tab's filters
- inputText: 'cilantro'
- hideKeyboard
- tapOn: 'Show recipe filters'
- assertVisible: 'Type'
- takeScreenshot: build/screenshots/88-add-recipe-dropdown
- tapOn: 'Hide recipe filters'
- tapOn: 'Add Salsa'
- scrollUntilVisible:
    element: '2 meals \+ 1 recipe · 9 items.*'
- assertVisible: 'Remove Salsa'
- scrollUntilVisible:
    element:
      id: 'new-list-name'
- assertVisible: 'Week A \+ Salsa'
# Leaving a list she set up asks first
- back
- tapOn: 'DISCARD|Discard'

# Delete the list
- tapOn: '.*Checking pantry.*'
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- scrollUntilVisible:
    element: 'Delete list'
- tapOn: 'Delete list'
- tapOn: 'DELETE|Delete'
- extendedWaitUntil:
    visible: 'No shopping lists yet.'
    timeout: 15000
