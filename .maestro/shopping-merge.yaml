# Two items on a list that are the same thing: merge them into one, with
# its name and category, and the amounts add up.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - shopping
---
- evalScript: ${output.email = 'merge' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: week
- tapOn: 'Shopping'
- tapOn: 'New list'
- extendedWaitUntil:
    visible: '.*Dinner, Chicken Enchiladas, Pico'
    timeout: 15000
- scrollUntilVisible:
    element: 'Save list'
- tapOn: 'Save list'
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- scrollUntilVisible:
    element: 'Shop at Macey.s'
- tapOn: 'Shop at Macey.s'
- scrollUntilVisible:
    element: 'Make list'
- tapOn: 'Make list'
- extendedWaitUntil:
    visible: '.* to buy at .*'
    timeout: 15000
# Roma tomatoes, added by hand: the same thing as the plum tomatoes
- runFlow:
    file: subflows/add-item.yaml
    env:
      TEXT: '2 roma tomatoes'
- scrollUntilVisible:
    element: 'Merge two items'
    direction: UP
- tapOn: 'Merge two items'
- assertVisible: 'Tap the two items that are the same thing.'
- scrollUntilVisible:
    element: 'roma tomatoes, 2.*'
    centerElement: true
- tapOn: 'roma tomatoes, 2.*'
- scrollUntilVisible:
    element: 'plum tomatoes, 3.*'
    direction: UP
    centerElement: true
- tapOn: 'plum tomatoes, 3.*'
- scrollUntilVisible:
    element: 'Merge into one item'
    direction: UP
    centerElement: true
- takeScreenshot: build/screenshots/103-merge-two-items
- scrollUntilVisible:
    element: 'Merge roma tomatoes and plum tomatoes'
    centerElement: true
- tapOn: 'Merge roma tomatoes and plum tomatoes'
- scrollUntilVisible:
    element: 'roma tomatoes, 5.*'
    centerElement: true
- assertNotVisible: 'plum tomatoes.*'
- takeScreenshot: build/screenshots/104-merged-item
