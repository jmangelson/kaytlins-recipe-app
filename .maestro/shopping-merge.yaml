# Two items on a list that are the same thing: merge them into one, with
# its name and category, and the amounts add up.
appId: com.jmangelson.kaytlinsrecipes
tags:
  - shopping
---
- evalScript: ${output.email = 'merge' + Date.now() + '@test.dev'}
- runFlow:
    file: subflows/setup.yaml
    env:
      EMAIL: ${output.email}
      FIXTURE: week
- tapOn: 'Shopping'
- tapOn: 'New list'
- extendedWaitUntil:
    visible: '.*Dinner, Chicken Enchiladas, Pico'
    timeout: 15000
- scrollUntilVisible:
    element: 'Save list'
- tapOn: 'Save list'
- extendedWaitUntil:
    visible: 'Check the pantry'
    timeout: 15000
- scrollUntilVisible:
    element: 'Shop at Macey.s'
- tapOn: 'Shop at Macey.s'
- scrollUntilVisible:
    element: 'Make list'
- tapOn: 'Make list'
- extendedWaitUntil:
    visible: '.* to buy at .*'
    timeout: 15000
# Roma tomatoes, added by hand: the same thing as the plum tomatoes
- runFlow:
    file: subflows/add-item.yaml
    env:
      TEXT: '2 roma tomatoes'
- scrollUntilVisible:
    element: 'Fix an item'
    direction: UP
- tapOn: 'Fix an item'
- scrollUntilVisible:
    element: 'roma tomatoes, 2.*'
    centerElement: true
- tapOn: 'roma tomatoes, 2.*'
- scrollUntilVisible:
    element: 'It’s the same as another item'
    centerElement: true
- tapOn: 'It’s the same as another item'
- assertVisible: 'Tap the item that’s the same as roma tomatoes.'
- scrollUntilVisible:
    element: 'plum tomatoes, 3.*'
    direction: UP
    centerElement: true
- tapOn: 'plum tomatoes, 3.*'
- scrollUntilVisible:
    element: 'Merge into one item'
    direction: UP
    centerElement: true
- takeScreenshot: build/screenshots/103-merge-two-items
- scrollUntilVisible:
    element: 'Merge roma tomatoes and plum tomatoes'
    centerElement: true
- tapOn: 'Merge roma tomatoes and plum tomatoes'
- scrollUntilVisible:
    element: 'roma tomatoes, 5.*'
    direction: UP
    centerElement: true
- assertNotVisible: 'plum tomatoes.*'
- takeScreenshot: build/screenshots/104-merged-item

# Its name: changes it everywhere ("roma" leaves the name)
- scrollUntilVisible:
    element: 'Fix an item'
    direction: UP
- tapOn: 'Fix an item'
- scrollUntilVisible:
    element: 'roma tomatoes, 5.*'
    centerElement: true
- tapOn: 'roma tomatoes, 5.*'
- takeScreenshot: build/screenshots/80c-fix-item-five-choices
- scrollUntilVisible:
    element: 'Its name'
    centerElement: true
- tapOn: 'Its name'
# (the hint focuses the field with the cursor at the end of the name)
- tapOn: 'Changes it in every recipe.*'
- eraseText: 20
- inputText: 'tomatoes'
# Typing near the bottom of the list: the field and its Save stay above the keyboard
- takeScreenshot: build/screenshots/115-typing-above-keyboard
- assertVisible: 'Save name'
- hideKeyboard
- takeScreenshot: build/screenshots/105-fix-name
- scrollUntilVisible:
    element: 'Save name'
    centerElement: true
- tapOn: 'Save name'
- scrollUntilVisible:
    element: 'tomatoes, 5.*'
    direction: UP
    centerElement: true
- assertNotVisible: 'roma tomatoes.*'

# A note for this trip: only on this list
- scrollUntilVisible:
    element: 'Fix an item'
    direction: UP
- tapOn: 'Fix an item'
- scrollUntilVisible:
    element: 'tomatoes, 5.*'
    centerElement: true
- tapOn: 'tomatoes, 5.*'
- scrollUntilVisible:
    element: 'A note for this trip'
    centerElement: true
- tapOn: 'A note for this trip'
- tapOn:
    id: 'fix-item-notes'
- inputText: 'ripe'
- hideKeyboard
- takeScreenshot: build/screenshots/105b-fix-note
- scrollUntilVisible:
    element: 'Save note'
    centerElement: true
- tapOn: 'Save note'
- scrollUntilVisible:
    element: 'tomatoes, 5.*'
    direction: UP
    centerElement: true
- assertVisible: 'tomatoes, 5.*Notes: ripe'
- assertNotVisible: '.*Recipe notes: ripe'
- takeScreenshot: build/screenshots/106-fixed-name-notes
